<div class="pfp-content app-pn-bg">
  <form novalidate class="pfp-form" [formGroup]="formGroup">
  
    <div class="pfp-title">{{ 'panel-forgot-password.title' | translate }}</div>
  
    <div pfp-mt-2>{{ 'panel-forgot-password.you_forgot_password' | translate }}</div>
  
    <app-field-input wd100 pfp-mt-2
      type="email"
      formControlName="email"
      [isRequired]="true"
      kind="email"
      label="panel-forgot-password.email_address"
      [maxLen]="cn_email.maxLength"
      [minLen]="cn_email.minLength"
      (input)="updateErrMsgObjs()">
    </app-field-input>
  
    <button matButton="elevated" pfp-mt-4 class="mat-primary stl-btn-brd"
      [disabled]="formGroup.invalid || !!isDisabled ? '' : undefined"
      (click)="doResend()">
      {{ 'panel-forgot-password.button_send' | translate }}
    </button>
      
    <div pfp-mt-4 class="pfp-note">
      <a no-decor routerLink="{{linkLogin}}">{{ 'panel-forgot-password.go_to_login_page' | translate }}</a>
    </div>
  </form>
  
  <div class="mat-mdc-form-field-subscript-wrapper">
    @for (errMsgObj of errMsgObjs; track errMsgObj.msg) {        
      <mat-error>{{ errMsgObj.msg | translate: errMsgObj.obj }}</mat-error>
    }
  </div>
</div>
