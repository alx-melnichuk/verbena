<div class="ppd-form">

  <div class="ppd-title">{{ 'panel-profile-delete.title_delete_account' | translate }}</div>
  <div ppd-mt-2>
    <span>{{ 'panel-profile-delete.note_before_deleting_account' | translate }}</span>
  </div>

  <div ppd-mt-4 class="ppd-actions">
    <button matButton="elevated" class="stl-btn-brd"
      [disabled]="isDisabledSubmit"
      (click)="removeAccount()">
      <span>{{ 'panel-profile-delete.btn_delete_account' | translate }}</span>
    </button>
  </div>
</div>

<div class="mat-mdc-form-field-subscript-wrapper">
  @for (errMsgObj of errMsgObjs; track errMsgObj) {
    <mat-error>{{ errMsgObj.msg | translate: errMsgObj.obj }}</mat-error>
  }
</div>
