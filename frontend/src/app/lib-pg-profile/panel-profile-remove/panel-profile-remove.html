<div class="ppr-form">

  <div class="ppr-title">{{ 'panel-profile-remove.title_delete_account' | translate }}</div>
  <div ppr-mt-2>
    <span>{{ 'panel-profile-remove.note_before_deleting_account' | translate }}</span>
  </div>

  <div ppr-mt-4 class="ppr-actions">
    <button matButton="elevated" class="stl-btn-brd"
      [disabled]="!!isDisabled ? '' : undefined"
      (click)="removeAccount()">
      <span>{{ 'panel-profile-remove.btn_delete_account' | translate }}</span>
    </button>
  </div>
</div>

<div class="mat-mdc-form-field-subscript-wrapper">
  @for (errMsgObj of errMsgObjs; track errMsgObj) {
    <mat-error>{{ errMsgObj.msg | translate: errMsgObj.obj }}</mat-error>
  }
</div>
