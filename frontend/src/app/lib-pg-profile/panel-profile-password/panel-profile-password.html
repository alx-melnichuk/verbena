<form novalidate class="ppp-form" [formGroup]="formGroup">

  <div class="ppp-title">{{ 'panel-profile-password.title_change_password' | translate }}</div>

  <app-field-password wd100 ppp-mt-2
    formControlName="curr_password"
    kind="password"
    hint="panel-profile-password.password_hint"
    [isRequired]="isRequiredPassword"
    label="panel-profile-password.current_password"
    [maxLen]="cn_password.maxLength"
    [minLen]="cn_password.minLength"
    [pattern]="cn_password.pattern"
    (input)="updateErrMsgObjs(); statePassword(cntls.curr_password.value);
      checkPassword(formGroup); doChangeData(formGroup);">
  </app-field-password>

  <app-field-password wd100 ppp-mt-4
    formControlName="new_password"
    kind="password"
    hint="panel-profile-password.password_hint"
    [isRequired]="isRequiredPassword"
    label="panel-profile-password.new_password"
    [maxLen]="cn_password.maxLength"
    [minLen]="cn_password.minLength"
    [pattern]="cn_password.pattern"
    (input)="updateErrMsgObjs(); statePassword(cntls.curr_password.value || cntls.new_password.value);
      checkPassword(formGroup); doChangeData(formGroup);">
  </app-field-password>

  <div ppp-mt-4 class="ppp-actions">
    <button matButton="elevated" class="stl-btn-brd"
      [disabled]="formGroup.pristine || formGroup.invalid || !!isDisabled ? '' : undefined"
      (click)="setNewPassword(formGroup)">
      <span>{{ 'panel-profile-password.btn_set_password' | translate }}</span>
    </button>
  </div>
</form>

<div class="mat-mdc-form-field-subscript-wrapper">
  @for (errMsgObj of errMsgObjs; track errMsgObj.msg) {
    <mat-error>
        {{ errMsgObj.msg | translate: getErrorObj(errMsgObj.obj, ('panel-profile-password.new_password' | translate)) }}
    </mat-error>
  }
</div>
