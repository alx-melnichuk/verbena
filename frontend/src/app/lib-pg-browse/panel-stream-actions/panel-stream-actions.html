@if (isShowBntPrepare(state)) {
  <button matButton="elevated" psa-btn class="stl-btn-brd" (click)="doChangeState(statePreparing)">
    <svg viewBox="0 0 96 96" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" 
      psa-mr-1 class="psa-svg-sz psa-ver-md">
      <path d="M19,15 C12,15 12,5 19,5 H78 C85,5 85,15 78,15 H19 Z" />
      <path d="M22,15 V22 C22,25 23,40 42,46 V49 C23,55 22,71 22,73 V80" />
      <path d="M75,15 V22 C75,25 74,40 55,46 V49 C74,55 75,71 75,73 V80" />
      <path d="M19,90 C12,90 12,80 19,80 H78 C85,80 85,90 78,90 H19 Z" />
    </svg>
    <span psa-mr-1 class="psa-ver-md">{{ 'panel-stream-actions.prepare_stream' | translate }}</span>
  </button>
}

@if (isShowBntStart(state)) {
  <button matButton="elevated" psa-btn class="stl-btn-brd" (click)="doChangeState(stateStarted)">
    <svg viewBox="0 0 96 96" fill="currentColor" psa-mr-1 class="psa-svg-sz psa-ver-md psa-scale">
      <path d="M24.5,28.5 a7,7 0,0,1 9,-8 l36,22.5 a9,9 0,0,1 0,10 l-36,22.5 a7,7 0,0,1 -9,-8 v-39.5 z" />
    </svg>
    <span psa-mr-1 class="psa-ver-md">{{ 'panel-stream-actions.go_live_stream' | translate }}</span>
  </button>
}

@if (isShowBntPause(state)) {
  <button matButton="elevated" psa-btn class="stl-btn-brd" (click)="doChangeState(statePaused)">
    <svg viewBox="0 0 96 96" fill="currentColor" psa-mr-1 class="psa-svg-sz psa-ver-md psa-scale">
      <path d="M24.5,28.6 a8,8 0,0,1 8,-8 h3 a8,8 0,0,1 8,8 v38.8 a8,8 0,0,1 -8,8 h-3 a8,8 0,0,1 -8,-8 v-38.8 z" />
      <path d="M52.5,28.6 a8,8 0,0,1 8,-8 h3 a8,8 0,0,1 8,8 v38.8 a8,8 0,0,1 -8,8 h-3 a8,8 0,0,1 -8,-8 v-38.8 z" />
    </svg>
    <span psa-mr-1 class="psa-ver-md">{{ 'panel-stream-actions.pause_stream' | translate }}</span>
  </button>
}

@if (isShowBtnStop(state)) {
  <button matButton="elevated" psa-btn class="stl-btn-brd" (click)="doChangeState(stateStopped)">
    <svg viewBox="0 0 96 96" fill="currentColor" stroke-linecap="round" stroke-linejoin="round"
      psa-mr-1 class="psa-svg-sz psa-ver-md psa-scale">
      <path d="M20.4,30.5 a10,10 0,0,1 10,-10 h35 a10,10 0,0,1 10,10 v35 a10,10 0,0,1 -10,10 h-35 a10,10 0,0,1 -10,-10 v-34 z" />
    </svg>
    <span psa-mr-1 class="psa-ver-md">{{ 'panel-stream-actions.stop_stream' | translate }}</span>
  </button>
}
