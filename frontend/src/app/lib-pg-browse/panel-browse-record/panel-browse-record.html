@if (!!stream) {
  <header class="pbr-header">
    {{ stream.id}} {{ stream.title }}
  </header>

  <a href="javascript:void(0);"  class="pbr-logo-wrap" (click)="doActionView(stream.id)">
    <app-image i-shd class="pbr-logo" [srcImg]="stream.logo"></app-image>
  </a>

  <section class="pbr-content">
    <div class="pbr-descript">
      {{ stream.descript }}
    </div>
    
    <div class="pbr-tags">
      @for (tag of stream.tags; track tag) {
        <span [class.pbr-active]="tag == activeTag">#{{ tag }}</span>&nbsp;
      }
    </div>
    <div class="pbr-starttime">
      {{ stream.starttime | dateTimeFormat:locale:formatDateTime }}
    </div>
  </section>
}
