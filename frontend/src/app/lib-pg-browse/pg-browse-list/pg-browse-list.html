@if (popTagIsLoading || strmCrdIsLoading) {
  <app-spinner isFillParent></app-spinner>
}
<div class="pbl-container app-pn-bg">
  
  <app-panel-browse-search class="pbl-border"
    [isLive]="isLive"
    [popTagIsLoading]="popTagIsLoading"
    [popTagList]="popTagList"
    (loadStrmCrdPage)="doLoadStrmCrdPage($event.isLive, $event.tag, $event.page, $event.isReset)">
  </app-panel-browse-search>

  <app-view-item-list hg100 class="pbl-card-list" vil-row vil-flx-wrp
    containerClass="global-scroll"
    [isReset]="strmCrdIsReset"
    [itemPage]="strmCrdItemPage"
    [maxSizeRows]="strmCrdMaxSizeRows"
    [rowsOnPage]="strmCrdRowsOnPage"
    (loadPage)="doLoadStrmCrdPage(isLive, tag, $event.page, false)">
    <ng-template let-streamDto="item">
      <app-panel-browse-record
        [activeTag]="tag"
        [locale]="localeSrv.getLocale()"
        [stream]="streamDto"
        (actionView)="doActionView($event)">
      </app-panel-browse-record>
    </ng-template>
  </app-view-item-list>

</div>
