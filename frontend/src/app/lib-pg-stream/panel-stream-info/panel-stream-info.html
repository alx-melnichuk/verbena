@if(!!streamDto) {
  <a class="psi-logo psi-img-shd" [href]="linkToStream">
    <app-image class="psi-logo-box" [srcImg]="streamDto.logo"></app-image>
  </a>

  <div class="psi-details">
    <div class="psi-date">
      {{ streamDto.starttime | dateTimeFormat:locale:formatDateTime }} 
    </div>
    <div class="psi-title">
      <a [href]="linkToStream">
        {{ streamDto.title }}
      </a>
    </div>
    <div class="psi-descript">{{ streamDto.descript }}</div>
  </div>

  <div class="psi-actions">
    @if (canDuplicate) {
      <button matButton="elevated" class="psi-action-btn stl-btn-brd psi-actions-box"
        (click)="doActionDuplicate(streamDto.id)" psi-mr-2>
        <span class="psi-action-label">
          <svg viewBox="0 0 96 96" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="6"
            psi-mr-1 class="psi-duplicate-accent">
            <path d="M58,5.5 h-28 a4,4 0,0,0 -4,2 l-14,14 a4,4 0,0,0 -2,4 v44 a8,8 0,0,0 8,8 h40 a8,8 0,0,0 8,-8 v-56 a8,8 0,0,0 -8,-8 z m-48,20 h14 a6,6 0,0,0 6,-6 v-14" />
            <path d="M80,17.5 h-14 m-36,60 v5 a8,8 0,0,0 8,8 h41 a8,8 0,0,0 8,-8 v-57  a8,8 0,0,0 -8,-8 " />
          </svg>
          <span>{{ 'panel-stream-info.btn-duplicate' | translate }}</span>
        </span>
      </button>
    }
    <div class="psi-actions-both">
      @if (canEdit) {
        <button matButton="elevated" class="psi-action-btn stl-btn-brd"
          (click)="doActionEdit(streamDto.id)" psi-mr-2>
          <span class="psi-action-label">
            <svg viewBox="0 0 96 96" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="6"
              psi-mr-1 class="psi-edit-accent">
              <path d="M64,12.0  h-28 a4,4 0,0,0 -4,2  l-14,14 a4,4 0,0,0 -2,4  v44 a8,8 0,0,0 8,8 h12 m36,-48 v-16 a8,8 0,0,0 -8,-8  m-48,20 h14 a6,6 0,0,0 6,-6 v-14" />
              <path d="M80,55 a22,22 0,1,1 -40,0 22,22 0,0,1 40,0 Z" />
              <path d="M49,74 l3.0,-9.4 14,-14 a2,2 0,0,1 2,0 l5,5 a2,2 0,0,1 0,2 l-14,14 z M61,55.4 l7,7.2" />
            </svg>
            <span>{{ 'panel-stream-info.btn-edit' | translate }}</span>
          </span>
        </button>
      }
      @if (canDelete) {
        <button matButton="elevated" class="psi-action-btn stl-btn-brd"
          (click)="doActionDelete(streamDto)" psi-mr-2>
          <span class="psi-action-label">
            <svg viewBox="0 0 96 96"  fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="6"
              psi-mr-1 class="psi-delete-accent">
            <path d="M64,12.0  h-28 a4,4 0,0,0 -4,2  l-14,14 a4,4 0,0,0 -2,4  v44 a8,8 0,0,0 8,8 h12 m36,-48 v-16 a8,8 0,0,0 -8,-8  m-48,20 h14 a6,6 0,0,0 6,-6 v-14" />
            <path d="M80,55 a22,22 0,1,1 -40,0 22,22 0,0,1 40,0 Z" />
            <path d="M52,56 l16,16 m0,-16 l-16,16" />
            </svg>
            <span>{{ 'panel-stream-info.btn-delete' | translate }}</span>
          </span>
        </button>
      }
    </div>
  </div>
}
