@if (isLoadStream) {
  <app-spinner isFillParent></app-spinner>
}
<app-panel-stream-editor
  [errMsgObjs]="errMsgObjs"
  [isDisabled]="isLoadStream"
  [locale]="localeSrv.getLocale()"
  [streamDto]="streamDto"
  [streamConfigDto]="streamConfigDto"
  (changeData)="doChangeData($event)"
  (updateStream)="doUpdateStream($event)">
</app-panel-stream-editor>
