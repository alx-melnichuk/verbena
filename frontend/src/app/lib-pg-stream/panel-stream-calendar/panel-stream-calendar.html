<mat-calendar #calendar class="app-pn-bg psc-pn2-bg"
  [dateClass]="dateClassFn"
  [headerComponent]="calendarHeader"
  [maxDate]="maxDate"
  [minDate]="minDate"
  [startAt]="selected || startAtDate"
  [selected]="selected"
  [startView]="'month'"
  (selectedChange)="doChangeSelected($event)"
  (viewChanged)="doViewChanged($event)">
</mat-calendar>

<ng-template>
  <app-calendar-header></app-calendar-header>
</ng-template>
