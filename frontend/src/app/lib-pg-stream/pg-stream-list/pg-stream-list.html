  [clndDaySelected]="evntDate"
  [clndIsLoading]="clndIsLoading"
  [clndMarkedDates]="clndMarkedDates"
  [clndMaxDate]="clndMaxDate"
  [clndMinDate]="clndMinDate"

  [strmMaxSizeRows]="strmMaxSizeRows"

  [strmFtrIsReset]="strmFtrIsReset"
  [strmFtrItemPage]="strmFtrItemPage"

  [evntItemPage]="evntItemPage"

  [locale]="localeSrv.getLocale()"

  (loadPastPage)="doLoadPastPage($event.page, $event.limit)"

  (resetInfo)="doResetInfo()"
  (actionDuplicate)="doActionDuplicate($event)"
  (actionEdit)="doActionEdit($event)"
  (actionDelete)="doActionDelete($event)">
