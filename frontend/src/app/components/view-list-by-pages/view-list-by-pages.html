<div [ngClass]="[`vlbp-container`, (containerClass || ``)]" #container>
  @if (!!templateRef) {
    @for (itemVal of dataList; track itemVal.id) {
      <ng-container
        [ngTemplateOutlet]="templateRef"
        [ngTemplateOutletContext]="{ item: itemVal, paramObj: paramObj }">
      </ng-container>
    }
  }
</div>
