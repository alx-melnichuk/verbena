<div class="ffu-container"
  appFieldDragAndDrop
  (fileDropped)="fileHandler($event, accepts, maxFileSize)">
  <input type="file" #fileDropRef [attr.id]="id"
    [attr.accept]="accepts || undefined"
    [attr.multiple]="!!isMultiple ? ``: undefined"
    [attr.disabled]="!!isDisabled || !!isReadonly ? ``: undefined"
    [attr.readonly]="!!isReadonly ? ``: undefined"
    (change)="fileHandler(getFileList($event.target), accepts, maxFileSize)"
  />
  <label [attr.for]="id">
    <svg viewBox="0 0 96 96" preserveAspectRatio="xMinYMin meet" fill="none" stroke="currentColor" stroke-linecap="round"
      stroke-linejoin="round" stroke-width="4" class="ffu-file-add">
      <path d="M64,12.0  h-28 a4,4 0,0,0 -4,2  l-14,14 a4,4 0,0,0 -2,4  v44 a8,8 0,0,0 8,8 h12 m36,-48 v-16 a8,8 0,0,0 -8,-8  m-48,20 h14 a6,6 0,0,0 6,-6 v-14" />
      <path d="M80,55 a22,22 0,1,1 -40,0 22,22 0,0,1 40,0 Z" />
      <path d="M60,55 v18 M51,64 h18" />
    </svg>
  </label>
  <div>
    <a href="javascript:void(0);">
      <label [attr.for]="id">{{ `field-file-upload.drag_files_or_browse` | translate }}</label>
    </a>
    <label [attr.for]="id" class="ffu-msg" [class.ffu-block]="isShowMsgFileTypes || isShowMsgFileSize">
      @if (isShowMsgFileTypes) {
        <span>{{ `field-file-upload.supported_file_types` | translate : { `validTypes`: availableFileTypes } }}</span>
        <br/>
      }
      @if (isShowMsgFileSize) {
        <span>{{ `field-file-upload.upload_no_more_than` | translate : { `maxFileSize`: availableMaxFileSize } }}</span>
      }
    </label>
  </div>
</div>
