<mat-form-field [formGroup]="formGroup"
  [subscriptSizing]="(formControl.touched && !!formControl.errors) || !!hint ? 'dynamic' : 'fixed'">
  
  @if (!!label) {
    <mat-label>{{ label | translate }}{{ !!isRequired ? " " : ""}}</mat-label>
  }
  @if (isIconPrefix) {
    <div matPrefix>
      <ng-content select="[matPrefix], [matIconPrefix]"></ng-content>
    </div>
  }

  <input matInput class="fi-input"
    type="{{type}}"
    formControlName="input"
    autocomplete="new-password"
    autocapitalize="off"
    [email]="type == `email` ? true : false"
    [required]="!!isRequired"
    [attr.maxlength]="maxLen != null && maxLen > 0 ? maxLen + 1 : undefined"
    [attr.spellcheck] ="!!isSpellcheck"
    (input)="onChange(formControl.value)"
    (blur)="onTouched()"
  />

  @if (isIconSuffix) {
    <div matSuffix>
      <ng-content select="[matSuffix], [matIconSuffix]"></ng-content>
    </div>
  }
  @if (!!hint) {
    <mat-hint>{{ hint | translate }}</mat-hint>
  }
  <mat-error>
    {{ (errorMsg || getErrorMsg(formControl.errors))
      | translate: getErrorObj(formControl.errors, (!!label ? (label | translate) : "")) }}
  </mat-error>

</mat-form-field>
