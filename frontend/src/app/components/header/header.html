<mat-toolbar class="app-pn-bg">
  <svg viewBox="0 0 96 96" class="h-logo-mini">
    <g fill="#006666" stroke="#004d4d" stroke-width="1" stroke-linecap="round">
      <path d="M51,90 V45 C56,35 81,10 95,28  C78,30 78,48 76,58  C75,64 75,90 51,90 Z" />
      <path d="M46,90 V45 C41,35 16,10 2,28  C19,30 19,48 21,58  C22,64 22,90 46,90 Z" />
    </g>
    <g fill="#ff00ff" stroke="#cc00cc">
      <circle cx="40" cy="21" r="7" />
      <circle cx="57" cy="21" r="7" />
      <circle cx="48" cy="7" r="6" />
    </g>
  </svg>

  <span h-ml-2></span>
  <h4 h-ml-2 class="h-logo-text">{{ 'app.name' | translate }}</h4>
  <span h-ml-2></span>
  
  @for (item of menuMainItems; track (item.code || item.label)) {
    <app-menu-bar class="nm-menu"
      [item]="item"
      (selected)="doSelected($event)">
      <ng-template #tmplMenuBar let-itemInfo="item">
        {{ itemInfo.label | translate }}
      </ng-template>
      <ng-template #tmplMenuItem let-subItemInfo="subItem">
        {{ subItemInfo.label | translate }}
      </ng-template>
    </app-menu-bar>
  }

  <span class="h-spacer"></span>
  
  <app-menu-item #shortMenu
    [items]="menuShortItems"
    (selected)="doSelected($event)">
    <ng-template #tmplMenuItem let-subItemInfo="subItem">
      <span>{{ subItemInfo.label | translate }}</span>
      @if (["theme", "local"].includes(subItemInfo.label.slice(0,5))) {
        <span class="h-item-box" [class.h-check]="subItemInfo.panelClass=='check'"></span>
      }
    </ng-template>
  </app-menu-item>

  @if (!!user) {
    <button matButton="text" type="button" class="h-nickname-btn" [matMenuTriggerFor]="shortMenu?.childMenu || null">
      <span class="h-nickname">{{ userNickname }}</span>
    </button>
    <button matButton="text" type="button" class="h-avatar-btn" [matMenuTriggerFor]="shortMenu?.childMenu || null">
      <app-image i-shd class="h-avatar" [srcImg]="user.avatar">
        <div img-is-missing class="h-img-smb">{{ userNameSymbols }}</div>
      </app-image>
    </button>
  } @else {
    <button matIconButton type="button" [matMenuTriggerFor]="shortMenu?.childMenu || null">
      <svg viewBox="0 0 96 96" fill="currentColor" stroke="currentColor" class="h-svg-more-vert">
        <circle cx="49" cy="25" r="7" />
        <circle cx="49" cy="48" r="7" />
        <circle cx="49" cy="71" r="7" />
      </svg>
    </button>
  }
</mat-toolbar>
