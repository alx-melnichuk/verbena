[package]
name = "vrb_chats"
edition = "2024"
description = "Library for chat functions."
keywords = ["vrb_chats", "web_chat"]
version.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
actix = { workspace = true }
actix-broker = { workspace = true }
actix-web = { workspace = true }
actix-web-actors = { workspace = true }
chrono = { workspace = true }
futures-util = { workspace = true }
log = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
utoipa = { workspace = true }
vrb_authent = { workspace = true }
vrb_common = { workspace = true }
vrb_db = { workspace = true }
vrb_tools = { workspace = true }

[features]
# default = ["test", "mockdata"]
test=[]
mockdata = []

[dev-dependencies]
# To perform testing of websocket interaction.
actix-test = "0.1"
vrb_authent = { version = "0.5", path="../vrb_authent", features = ["mockdata"] }
