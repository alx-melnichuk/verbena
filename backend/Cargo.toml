[workspace]
members = [
    "vrb_app",
    "vrb_authent",
    "vrb_chats",
    "vrb_common",
    "vrb_db",
    "vrb_profiles",
    "vrb_streams",
    "vrb_tools",
]
resolver = "3"

[workspace.package]
version = "0.5.0"
authors = ["alx.melnichuk"]
rust-version = "1.99.1"
license = "MIT"

[workspace.dependencies]
actix = "0.13.5"
actix-broker = "0.4.4"
actix-cors = "0.7.2"
actix-files = "0.7.3"
actix-multipart = "0.8.5"
actix-multipart-test = "0.0.3" # To test a web form with data and a file.
actix-web = { version = "4.18.1", features = ["openssl"] }
actix-web-actors = "4.3.1"
argon2 = "0.6.0"
chrono = { version = "0.4.45", features = ["serde"] }
dotenv = "0.15.0"
email_address = "0.2.9"
env_logger = "0.11.11"
futures-util = "0.3.34"
handlebars = "6.4.4"
image = "0.25.10"
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
lettre = { version = "0.11.23", features = ["tokio1", "tokio1-native-tls"] }
log = "0.4.35"
mime = "0.3.17"
openssl = "0.10.82"
rand = "0.10.3"
regex = "1.12.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", features = ["chrono", "macros", "postgres", "runtime-tokio"] }
utoipa = { version = "6.0.0", features = ["chrono", "actix_extras"] }
utoipa-swagger-ui = { version = "10.0.2", features = ["actix-web"] }
utoipa-redoc = { version = "7.0.0", features = ["actix-web"] }
utoipa-rapidoc = { version = "7.0.0", features = ["actix-web"] }
vrb_app = { version = "0.5", path="./vrb_app" }
vrb_authent = { version = "0.5", path="./vrb_authent" }
vrb_chats = { version = "0.5", path="./vrb_chats" }
vrb_common = { version = "0.5", path="./vrb_common" }
vrb_db = { version = "0.5", path="./vrb_db" }
vrb_profiles = { version = "0.5", path="./vrb_profiles" }
vrb_streams = { version = "0.5", path="./vrb_streams" }
vrb_tools = { version = "0.5", path="./vrb_tools" }

[profile.dev]
debug = 1

[profile.dev.package.sqlx-macros]
opt-level = 3
